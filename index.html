
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis XV años | Arlenne Espinoza</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="invitacion" id="invitacion">

        <!-- PORTADA -->
        <div class="portada-contenedor">

            <img
                src="Imagenes/Imagen_de _la_invitacion.jpeg"
                class="portada"
                alt="Invitación de XV años"
            >

            <button id="botonAbrir" type="button">
                PRESIONA PARA ABRIRLA
            </button>

        </div>

        <!-- INVITACIÓN COMPLETA DE ARLENNE -->
        <section id="contenido" class="contenido oculto">

            <div class="imagen-con-ubicacion">

                <!-- IMAGEN DE LA INVITACIÓN -->
                <img
                    src="Imagenes/Invitacion_Arlenne.png"
                    class="invitacion-completa"
                    alt="Invitación XV años de Arlenne Espinoza"
                >

                <!-- BOTÓN DE UBICACIÓN -->
                <a
                    class="boton-ubicacion"
                    href="https://www.google.com/maps/place/Sal%C3%B3n+de+eventos+La+Huerta,+Benito+Ju%C3%A1rez+238,+Sin+Nombre+Loc.+Compostela,+Nueva+Galicia,+63700+Compostela,+Nay./@21.2373209,-104.900378,15z/data=!4m6!3m5!1s0x8427295d423ff4a7:0xbd2d918fa7ad6241!8m2!3d21.2373209!4d-104.900378!16s%2Fg%2F11fs0312xj"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📍 VER UBICACIÓN
                </a>

                <!-- CONTADOR REGRESIVO -->
                <div class="contador" id="contador">

                    <div class="contador-item">
                        <span id="dias">000</span>
                        <small>DÍAS</small>
                    </div>

                    <div class="contador-item">
                        <span id="horas">00</span>
                        <small>HORAS</small>
                    </div>

                    <div class="contador-item">
                        <span id="minutos">00</span>
                        <small>MIN</small>
                    </div>

                    <div class="contador-item">
                        <span id="segundos">00</span>
                        <small>SEG</small>
                    </div>

                </div>

            </div>

            <!-- BOTÓN CONFIRMAR INVITACIÓN -->
            <button id="botonCerrar" type="button">
                CONFIRMAR LA INVITACIÓN
            </button>

        </section>

    </main>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
